name: PEFY isolated security tests
on:
  pull_request:
    paths:
      - 'pefy/runtime/mcp_readiness_probe.py'
      - 'pefy/runtime/graphify_health_server.py'
      - 'pefy/runtime/health_server.py'
      - 'pefy/integrations/public_api_gateway.py'
      - 'tests/test_mcp_readiness_probe.py'
      - 'tests/test_public_api_gateway.py'
      - '.github/workflows/pefy-isolated-security-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax checks
        run: python -m compileall -q pefy/runtime/mcp_readiness_probe.py pefy/runtime/graphify_health_server.py pefy/runtime/health_server.py pefy/integrations/public_api_gateway.py
      - name: Isolated tests (no external network calls)
        run: python -m unittest discover -s tests -p 'test_*gateway.py' && python -m unittest discover -s tests -p 'test_mcp_readiness_probe.py'
