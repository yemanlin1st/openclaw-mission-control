name: PEFY Capability Validation

on:
  push:
    branches:
      - "pefy/**"
  pull_request:
    paths:
      - "pefy/**"
      - ".github/workflows/pefy-capabilities.yml"
  workflow_dispatch:

jobs:
  validate-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate JSON capability files
        run: |
          python -m json.tool pefy/config/capabilities.json >/dev/null
          python -m json.tool pefy/config/free-ai-providers.example.json >/dev/null
          python -m json.tool pefy/security/blockchain-dark-forest-profile.json >/dev/null
      - name: Assert no obvious committed API keys
        run: |
          if grep -RIE '(sk-[A-Za-z0-9_-]{20,}|AIza[0-9A-Za-z_-]{20,}|hf_[A-Za-z0-9]{20,})' pefy/; then
            echo "Potential secret detected"
            exit 1
          fi

  graphify-install-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bootstrap Graphify
        run: bash pefy/scripts/bootstrap_graphify.sh
